# Portfolio — static Next.js export. Deployed by rsync from ~/Developer/sauravsharma.info (deploy.sh).
server {
    listen 80;
    listen [::]:80;
    server_name sauravsharma.info www.sauravsharma.info;
    return 301 https://sauravsharma.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sauravsharma.info;
    ssl_certificate /etc/letsencrypt/live/sauravsharma.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauravsharma.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://sauravsharma.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sauravsharma.info;
    ssl_certificate /etc/letsencrypt/live/sauravsharma.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauravsharma.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sauravsharma.info;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/x-component;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /Saurav_Sharma_Resume.pdf {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition 'inline; filename="Saurav_Sharma_Resume.pdf"' always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.js metadata routes are emitted without file extensions.
    location ~ ^/(opengraph-image|apple-icon)$ {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
