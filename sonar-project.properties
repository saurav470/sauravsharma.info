# SonarQube (self-hosted). Run: pnpm sonar   (needs $sonarcube_key in the environment)
sonar.projectKey=sauravsharma-info
sonar.projectName=sauravsharma.info (portfolio)
sonar.host.url=https://sonarqube.sauravsharma.online
sonar.sources=app,components,lib
sonar.tests=test
sonar.exclusions=**/node_modules/**,out/**,.next/**,coverage/**,**/*.svg
sonar.coverage.exclusions=app/opengraph-image.tsx,app/apple-icon.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
